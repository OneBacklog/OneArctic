name: Bug Report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit hash
      placeholder: ghcr.io/onebacklog/onearctic:3.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and Device
      placeholder: Firefox 130 on Android, installed as PWA
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `docker compose logs app` or the browser console
      render: shell
